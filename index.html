<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tersten Söyle</title>
<meta name="theme-color" content="#f3f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tersten Söyle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tek sütun, kayıt düğmesi üstte, iki dalga formu (ileri / geri) alt alta */
:root {
  --bg: #f3f1f7;
  --surface: #ffffff;
  --fg: #1d1a26;
  --muted: #6c6680;
  --line: #dcd7e8;
  --accent: #6a3df0;
  --accent-2: #e8568a;
  --rec: #e23b3b;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121b; --surface: #1e1b28; --fg: #ece9f5; --muted: #9a93b0;
    --line: #322d42; --accent: #9b7bff; --accent-2: #ff7aa8; --rec: #ff5a5a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121b; --surface: #1e1b28; --fg: #ece9f5; --muted: #9a93b0;
  --line: #322d42; --accent: #9b7bff; --accent-2: #ff7aa8; --rec: #ff5a5a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.5 var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header h1 {
  font-weight: 800; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1; margin: 0;
  letter-spacing: -0.02em; text-wrap: balance;
}
header h1 .flip { display: inline-block; transform: scaleX(-1); color: var(--accent); }
header p { margin: 10px 0 0; color: var(--muted); max-width: 46ch; }

.recorder { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.rec-btn {
  width: 96px; height: 96px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--rec); color: #fff; font: 800 1rem var(--display);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--rec) 20%, transparent);
  transition: transform .15s;
}
.rec-btn:hover { transform: scale(1.04); }
.rec-btn:focus-visible, button:focus-visible, label.file:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
.rec-btn.on { animation: pulse 1.2s infinite; border-radius: 28px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--rec) 10%, transparent); } }
@media (prefers-reduced-motion: reduce) { .rec-btn.on { animation: none; } }
.rec-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.timer { font: 500 2rem var(--mono); font-variant-numeric: tabular-nums; }
.status { color: var(--muted); font-size: .95rem; }
label.file { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: .95rem; }
label.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.track {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.track-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
.track-head span { font: .8rem var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
canvas { width: 100%; height: 80px; display: block; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
button.btn {
  font: 500 .95rem var(--display); border-radius: 999px; padding: 9px 18px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.btn:disabled { opacity: .4; cursor: default; }
.track.reversed { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.speed { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
.speed input { flex: 1; accent-color: var(--accent); }
.speed output { font: .9rem var(--mono); min-width: 3.5ch; color: var(--fg); }

button, label.file { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
@media (max-width: 480px) {
  body { padding-block: 20px 32px; }
  main { gap: 20px; }
  .recorder { flex-direction: column; text-align: center; gap: 14px; }
  .rec-info { align-items: center; }
  .rec-btn { width: 112px; height: 112px; font-size: 1.1rem; }
  .controls { flex-direction: column; }
  button.btn { width: 100%; padding: 13px 18px; font-size: 1rem; }
  .speed input { height: 32px; }
}

.tip { font-size: .9rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.tip b { color: var(--fg); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tersten <span class="flip">Söyle</span></h1>
    <p>Bir şey söyle, kaydet ve sesinin sondan başa doğru nasıl çaldığını dinle.</p>
  </header>

  <section class="recorder">
    <button class="rec-btn" id="recBtn" aria-label="Kaydı başlat">Kaydet</button>
    <div class="rec-info">
      <div class="timer" id="timer">00:00.0</div>
      <div class="status" id="status">Kaydetmek için kırmızı düğmeye bas.</div>
      <label class="file">ya da bir ses dosyası seç
        <input type="file" id="fileInput" accept="audio/*">
      </label>
    </div>
  </section>

  <section class="track">
    <div class="track-head"><h2>Orijinal</h2><span id="durA">—</span></div>
    <canvas id="waveA"></canvas>
    <div class="controls">
      <button class="btn" id="playA" disabled>▶ Dinle</button>
    </div>
  </section>

  <section class="track reversed">
    <div class="track-head"><h2>Tersten</h2><span id="durB">—</span></div>
    <canvas id="waveB"></canvas>
    <div class="controls">
      <button class="btn primary" id="playB" disabled>◀ Tersten dinle</button>
      <button class="btn" id="saveB" disabled>WAV olarak indir</button>
    </div>
    <div class="speed">
      <label for="rate">Hız</label>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="1">
      <output id="rateOut">1.00×</output>
    </div>
  </section>

  <p class="tip"><b>Oyun önerisi:</b> Tersten kaydı dinle, duyduğunu taklit ederek yeniden kaydet, sonra o kaydı ters çevir. Gerçek cümlen geri çıkıyor mu?</p>
</main>

<script>
const $ = id => document.getElementById(id);
let ctx, recorder, chunks = [], startTime = 0, tick;
let original = null, reversed = null, playing = null;

function audioCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function fmt(sec) {
  const m = Math.floor(sec / 60), s = sec - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0");
}

// Kayıt
$("recBtn").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx();
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(tick);
      $("recBtn").classList.remove("on");
      $("recBtn").textContent = "Kaydet";
      $("recBtn").setAttribute("aria-label", "Kaydı başlat");
      const blob = new Blob(chunks, { type: recorder.mimeType });
      await load(await blob.arrayBuffer());
    };
    recorder.start();
    startTime = performance.now();
    tick = setInterval(() => $("timer").textContent = fmt((performance.now() - startTime) / 1000), 100);
    $("recBtn").classList.add("on");
    $("recBtn").textContent = "Durdur";
    $("recBtn").setAttribute("aria-label", "Kaydı durdur");
    $("status").textContent = "Kaydediliyor… bitince Durdur'a bas.";
  } catch (err) {
    $("status").textContent = "Mikrofona erişilemedi. Tarayıcıda mikrofon izni verip tekrar dene, ya da bir ses dosyası seç.";
  }
});

$("fileInput").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  audioCtx();
  await load(await f.arrayBuffer());
});

// Ters çevirme
async function load(arrayBuf) {
  $("status").textContent = "Ses işleniyor…";
  try {
    original = await audioCtx().decodeAudioData(arrayBuf);
  } catch {
    $("status").textContent = "Bu ses okunamadı. Başka bir kayıt ya da dosya dene.";
    return;
  }
  reversed = ctx.createBuffer(original.numberOfChannels, original.length, original.sampleRate);
  for (let c = 0; c < original.numberOfChannels; c++) {
    const src = original.getChannelData(c), dst = reversed.getChannelData(c), n = src.length;
    for (let i = 0; i < n; i++) dst[i] = src[n - 1 - i];
  }
  $("timer").textContent = fmt(original.duration);
  $("durA").textContent = $("durB").textContent = original.duration.toFixed(1) + " sn";
  drawWave($("waveA"), original, getCss("--muted"));
  drawWave($("waveB"), reversed, getCss("--accent"));
  ["playA", "playB", "saveB"].forEach(id => $(id).disabled = false);
  $("status").textContent = "Hazır. Tersten dinle!";
}

// Çalma
function play(buffer, btn, label, rate) {
  stop();
  const src = audioCtx().createBufferSource();
  src.buffer = buffer;
  src.playbackRate.value = rate;
  src.connect(ctx.destination);
  src.onended = () => { if (playing === src) stop(); };
  src.start();
  playing = src;
  playing.btn = btn; playing.label = label;
  btn.textContent = "■ Durdur";
}
function stop() {
  if (!playing) return;
  const p = playing; playing = null;
  p.onended = null;
  try { p.stop(); } catch {}
  p.btn.textContent = p.label;
}
$("playA").addEventListener("click", e => playing?.btn === e.currentTarget ? stop() : play(original, e.currentTarget, "▶ Dinle", 1));
$("playB").addEventListener("click", e => playing?.btn === e.currentTarget ? stop() : play(reversed, e.currentTarget, "◀ Tersten dinle", +$("rate").value));
$("rate").addEventListener("input", e => {
  $("rateOut").textContent = (+e.target.value).toFixed(2) + "×";
  if (playing?.btn === $("playB")) playing.playbackRate.value = +e.target.value;
});

// WAV indirme
$("saveB").addEventListener("click", () => {
  const url = URL.createObjectURL(toWav(reversed));
  const a = document.createElement("a");
  a.href = url; a.download = "tersten.wav";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
function toWav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, rate = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); out.setUint32(4, 36 + len * ch * 2, true); w(8, "WAVE");
  w(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, rate, true); out.setUint32(28, rate * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true);
  w(36, "data"); out.setUint32(40, len * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++, o += 2) {
    const s = Math.max(-1, Math.min(1, data[c][i]));
    out.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([out], { type: "audio/wav" });
}

// Dalga formu
function getCss(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function drawWave(canvas, buffer, color) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  g.strokeStyle = getCss("--line"); g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  if (!buffer) return;
  const data = buffer.getChannelData(0), bars = Math.floor(w / 4), step = Math.floor(data.length / bars) || 1;
  g.fillStyle = color;
  for (let i = 0; i < bars; i++) {
    let peak = 0;
    for (let j = i * step; j < (i + 1) * step && j < data.length; j++) peak = Math.max(peak, Math.abs(data[j]));
    const bh = Math.max(2, peak * h * 0.95);
    g.fillRect(i * 4, (h - bh) / 2, 2.5, bh);
  }
}
function redraw() {
  drawWave($("waveA"), original, getCss("--muted"));
  drawWave($("waveB"), reversed, getCss("--accent"));
}
addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
redraw();
</script>
</body>
</html>
